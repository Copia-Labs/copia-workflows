# Audits Rockwell Add-On Instructions across the repositories listed below: for every
# repository it finds every ACD project file, converts each to L5X via the Copia
# conversion service, extracts each AOI's name and revision, and publishes a combined
# aoi-audit.csv artifact on the run page.
#
# 1. Ensure the `runs-on` field is set to a valid runner label.
# 2. List the repositories to audit under `repos`, one per line. Blank lines and lines
#    starting with # are ignored.
# 3. `token` must have read access to every repository listed. COPIA_TOKEN is the
#    standard provided token. If it cannot reach a repository you want to audit, store
#    an access token that can in your Copia repository or organization settings and
#    reference that secret instead.
# 4. Ensure the runner has Git and Git LFS installed — ACD files are typically stored in
#    Git LFS.
# 5. Run the workflow from the Actions tab, or uncomment the `schedule` block for a
#    recurring audit. Download aoi-audit.csv from the run page's Artifacts section when
#    it finishes.
#
# aoi-audit.csv columns: AOI Name, Version Num, Repository, Source File. Every ACD in
# every repository is audited, so a repository holding several projects contributes rows
# for each, and the Source File column keeps them attributable.
#
# A repository that cannot be cloned, or an ACD that cannot be converted, is reported in
# the run summary and the audit continues, so one bad repository does not cost the rest.
#
# All inputs are documented at github.com/Copia-Labs/aoi-audit.
name: ACD-AOI-Audit
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 6 * * 1' # every Monday at 06:00 UTC

jobs:
  audit:
    runs-on: self-hosted
    steps:
      - name: Audit every ACD file in every repository
        uses: Copia-Labs/aoi-audit@v1
        with:
          repos: |
            MyOrganization/my-first-repository
            MyOrganization/my-second-repository
          token: ${{ secrets.COPIA_TOKEN }}

      - name: Upload the combined CSV
        uses: actions/upload-artifact@v3
        with:
          name: aoi-audit
          path: aoi-audit.csv
